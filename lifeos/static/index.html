<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeOS · 我的白板</title><link rel="stylesheet" href="/style.css"></head>
<body>
<a class="pocket-entry" href="/pocket/">LifeOS Pocket ↗</a>
<button id="canvas-add" data-add-module aria-label="添加模块" title="添加模块">+</button>
<div id="viewport" aria-label="无边白板"><div id="workspace"></div></div>
<dialog id="utility-dialog"><div class="dialog-head"><span></span><button class="icon-button" data-close aria-label="关闭">×</button></div><div id="utility-content"></div></dialog>
<dialog id="module-dialog"><form id="module-form"><div class="dialog-head"><h2 id="module-heading">添加一个模块</h2><button type="button" class="icon-button" data-close aria-label="关闭">×</button></div><p class="hint">每个模块独立收纳一类记录。之后可以改名、添加属性和调整位置。</p><label>从哪里开始<select id="module-kind" name="kind"><option value="journal">每日记录</option><option value="health">健康记录</option><option value="shopping">购物记录</option><option value="plans">计划</option><option value="custom">空白模块</option></select></label><label>模块名称<input id="module-name" name="name" required maxlength="80" placeholder="例如：阅读记录"></label><label>展示方式<select id="module-view" name="view"><option value="list">列表</option><option value="table">表格</option></select></label><div class="property-heading"><span>自定义属性</span><button type="button" class="quiet" id="add-field">＋ 添加属性</button></div><p class="hint compact">日期、名称和内容已包含在每条记录中。</p><div id="field-list"></div><p id="module-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" class="quiet" data-page="data">数据与导出</button><span></span><button type="button" class="quiet" data-close>取消</button><button class="primary" type="submit" id="save-module">创建模块</button></div></form></dialog>
<dialog id="record-dialog" class="record-dialog"><form id="record-form"><div class="dialog-head"><span class="hint" id="record-heading">新的记录</span><button type="button" class="icon-button" data-close aria-label="关闭">×</button></div><input class="record-title" name="title" aria-label="记录标题" placeholder="无标题" required maxlength="200"><div class="record-properties"><label>所属模块<select name="module_id" id="record-module"></select></label><label>日期<input type="date" name="date" required></label><label id="status-label">状态<select name="status"><option value="todo">未完成</option><option value="done">已完成</option></select></label><label id="amount-label">金额<input name="amount" inputmode="decimal" placeholder="未知留空"></label><label id="currency-label">币种<input name="currency" placeholder="例如 CNY"></label><div id="custom-properties"></div></div><textarea class="record-body" name="body" aria-label="记录内容" placeholder="在这里写下内容…" rows="7"></textarea><div id="record-attachments"></div><label class="attachment-control">＋ 添加图片或附件<input id="attachment-input" type="file" multiple accept=".png,.jpg,.jpeg,.webp,.gif,.pdf,.txt"></label><div id="related-records"></div><p id="record-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" class="quiet danger" id="delete-record">移到回收站</button><span></span><button type="button" class="quiet" data-close>取消</button><button type="submit" class="primary" id="save-record">保存</button></div></form></dialog>
<dialog id="import-dialog"><div class="dialog-head"><h2>导入记录或备份</h2><button class="icon-button" data-close aria-label="关闭">×</button></div><p class="hint">可以导入整个白板，也可以只导入一个模块。相同编号默认跳过。</p><label>整理结果<textarea id="import-text" rows="8" placeholder="粘贴整理后的 JSON"></textarea></label><label>或选择备份文件<input type="file" id="import-file" accept=".json,.zip"></label><label class="inline-label"><input type="checkbox" id="overwrite">更新相同编号的模块和记录</label><p id="import-error" class="error" role="alert"></p><div class="dialog-actions"><button class="quiet" id="copy-prompt">复制整理指令</button><span></span><button class="primary" id="run-import">导入</button></div></dialog>
<div id="toast" role="status" hidden></div><script src="/app.js"></script></body></html>
